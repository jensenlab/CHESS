name: LabwarePlotting Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'LabwarePlotting/**'
      - '.github/workflows/docs-labwareplotting.yml'
  pull_request:
    paths:
      - 'LabwarePlotting/**'
      - '.github/workflows/docs-labwareplotting.yml'

concurrency:
  group: docs-labwareplotting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: LabwarePlotting
      - name: Install GitHubActions.jl logger
        run: |
          using Pkg
          Pkg.activate("docs-logger-env"; shared=true)
          Pkg.add(Pkg.PackageSpec(name="GitHubActions", version="0.1"))
        shell: julia --color=yes {0}
      - name: Instantiate LabwarePlotting docs environment
        run: julia --project=LabwarePlotting/docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy LabwarePlotting docs
        run: |
          julia --project=LabwarePlotting/docs -e '
              @eval Module() begin
                  push!(LOAD_PATH, "@docs-logger-env")
                  import Logging, GitHubActions
                  Logging.global_logger(GitHubActions.GitHubActionsLogger())
                  pop!(LOAD_PATH)
              end
              include("LabwarePlotting/docs/make.jl")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
