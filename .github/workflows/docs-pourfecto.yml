name: Pourfecto Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Pourfecto/**'
      - '.github/workflows/docs-pourfecto.yml'
  pull_request:
    paths:
      - 'Pourfecto/**'
      - '.github/workflows/docs-pourfecto.yml'

concurrency:
  group: docs-pourfecto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: Pourfecto
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          project: Pourfecto/docs
